aid: cuemath
name: Cuemath
description: 'Cuemath is an India-headquartered education technology company founded
  in 2013 by Manan Khurma that delivers live, one-to-one online math tutoring to students
  in grades K through 12 across more than 80 countries. Its MathFit framework and LEAP
  learning platform pair certified tutors with an interactive, gamified curriculum aligned
  to US Common Core standards, spanning arithmetic, algebra, geometry, pre-calculus,
  AP calculus and standardized test preparation. Cuemath sells directly to families as
  a subscription tutoring product; it operates a consumer web and mobile application
  rather than a developer platform, and publishes no public API, SDK or developer portal.'
